# ─────────────────────────────────────────────────────────────────────────
# GitHub Pages deploy for the Jekyll site. Runs on every push to main.
# Settings → Pages → Build and deployment → Source must be "GitHub Actions".
# Builds with the committed Gemfile/Gemfile.lock (Jekyll 4). The previous
# Astro site is preserved on the `astro-site-archive` branch.
# ─────────────────────────────────────────────────────────────────────────
name: Deploy Jekyll site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true   # runs `bundle install` and caches gems

      # OPTIONAL — regenerate the editable .pptx/.docx decks from each module's
      # `session:` source before building, so downloads ship in the assets.
      # These are the framework-agnostic build scripts from ../scripts (unchanged
      # by this migration). Uncomment once the deck outputs are wired to
      # assets/modules/<id>/ inside this Jekyll site (see MIGRATION-NOTES.md).
      # - name: Generate editable decks
      #   run: |
      #     sudo apt-get update -qq
      #     sudo apt-get install -y -qq pandoc librsvg2-bin python3-venv
      #     python3 -m venv .venv
      #     .venv/bin/pip install --quiet python-pptx pyyaml
      #     node scripts/make-reference-templates.mjs
      #     node scripts/session-to-decks.mjs
      #     .venv/bin/python scripts/session_to_pptx.py

      - name: Build with Jekyll
        # baseurl "/fair-playbooks" makes the GitHub *project* page work at
        # github.io/fair-playbooks/. Drop --baseurl (or set it to "") if you
        # serve from a custom domain / user page at the root.
        run: bundle exec jekyll build --baseurl "/fair-playbooks"
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
